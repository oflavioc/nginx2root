name: test

on:
  push:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python -m py_compile h2c_flow_control_test.py compatibility_runner.py
      - run: uv run pytest
      - run: uvx black --check h2c_flow_control_test.py compatibility_runner.py suite tests

  compact-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Restore Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/nginx2root-docker-images.tar
          key: nginx2root-docker-v2-nginx-1.31.6-1.31.7-1.31.8-1.31.9-python-3.10-slim
      - name: Pull images on cache miss
        if: steps.cache-images.outputs.cache-hit != 'true'
        id: cache-images
        run: |
          docker pull --platform linux/amd64 nginx:1.31.6
          docker pull --platform linux/amd64 nginx:1.31.7
          docker pull --platform linux/amd64 nginx:1.31.8
          docker pull --platform linux/amd64 nginx:1.31.9
          docker pull --platform linux/amd64 python:3.10-slim
          docker save nginx:1.31.6 nginx:1.31.7 nginx:1.31.8 nginx:1.31.9 python:3.10-slim -o /tmp/nginx2root-docker-images.tar
      - name: Load cached images
        if: steps.cache-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/nginx2root-docker-images.tar
      - run: |
          uv run python -I h2c_flow_control_test.py \
            --docker \
            --versions 1.31.6,1.31.7,1.31.8,1.31.9 \
            --output /tmp/nginx2root-compact-evidence.json \
            --command-timeout 90 \
            --client-timeout 90 \
            --acknowledge-local-lab I-AUTHORIZE-LOCAL-LAB
      - name: Check evidence and cleanup
        run: |
          python -c 'import json; e=json.load(open("/tmp/nginx2root-compact-evidence.json")); assert e["passed"] and e["cleanup_attempted"] and e["scope"] == "accounting_only_not_rce"'
          test -z "$(docker ps -aq --filter label=io.censys.research.nginx2root-compact)"
